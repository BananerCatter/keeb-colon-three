[keyboard]
name = "keeb-colon-three"
product_name = "keeb-colon-three"
vendor_id = 0x4c4b
product_id = 0x4643
manufacturer = "Bananya"
chip = "rp2040"

[matrix]
# Row and col pins are mandatory
row_pins = ["PIN_10","PIN_11","PIN_12","PIN_13","PIN_14"]
col_pins = ["PIN_0", "PIN_1", "PIN_2", "PIN_3", "PIN_4", "PIN_5", "PIN_6", "PIN_7", "PIN_8", "PIN_9", "PIN_17", "PIN_16"]
bootmagic = [0, 0] 
# RMK uses col2row as the default matrix diode direction, if you want to use a row2col matrix, add `row2col = true`
# row2col = true

[layout]
rows = 5
cols = 12
layers = 2

matrix_map="""
(0,0,L) (0,1,L) (0,2,L) (0,3,L) (0,4,L) (0,5,L) 	(0,6,R) (0,7,R) (0,8,R) (0,9,R) (0,10,R) (0,11,R)
(1,0,L) (1,1,L) (1,2,L) (1,3,L) (1,4,L) (1,5,L) 	(1,6,R) (1,7,R) (1,8,R) (1,9,R) (1,10,R) (1,11,R)
(2,0,L) (2,1,L) (2,2,L) (2,3,L) (2,4,L) (2,5,L) 	(2,6,R) (2,7,R) (2,8,R) (2,9,R) (2,10,R) (2,11,R)
(3,0,L) (3,1,L) (3,2,L) (3,3,L) (3,4,L) (3,5,L) 	(3,6,R) (3,7,R) (3,8,R) (3,9,R) (3,10,R) (3,11,R)
                        (4,3,L) (4,4,L) (4,5,L) 	(4,6,R) (4,7,R) (4,8,R)

"""
[[layer]]
name = "base_layer"
keys = """
esc 1 2 3 4 5	 		6 7 8 9 0 -
tab q w e r t	 		y u i o p bsls
bspc a s d f g 	 		h j k l ; '
lctl z x c v b 	 		n m , . slsh rctl
	 lsft l_alt spc 	rwin ropt TT(1)
"""
encoders = [["AudioVolUp", "AudioVolDown"]]

[[layer]]
name= "mod"
keys= """
No F1 F2 F3 F4 F5		F6 F7 F8 F9 F10 +
caps F11 F12 No No		pscr ins home pgup pgdn del
No No No No No No 		Left Down Up Right [ ]
_ ms_left ms_down ms_up ms_right ms_btn1		ms_btn2 ms_btn3 ms_whlu ms_whld _ _
volu mute vold		mnxt mprv mstp 
"""
encoders = [["PageDown", "PageUp"]]

[[input_device.encoder]]
pin_a = "PIN_15"
pin_b = "PIN_18"

internal_pullup=true
phase="resolution"
resolution = 2
reverse = false
